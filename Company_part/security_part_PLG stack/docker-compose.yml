version: '3.8'

services:

  # Service 1: Loki -The log storage system
  loki:
    image: grafana/loki:latest 
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" 
    networks:
      - monitoring

  # Service 2: Promtail -The log collector
  promtail:
    image: grafana/promtail:latest 
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      # !!! IMPORTANT: YOU MUST CHANGE THE PATH ON THE LEFT !!!
      - /path/to/your/conpot_logs:/var/log/conpot/:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring

  # Service 3: Grafana -The dashboard and UI
  grafana:
    image: grafana/grafana:latest 
    container_name: grafana
    ports:
      - "3000:3000" 
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

volumes:
  grafana_data:

networks:
  monitoring: